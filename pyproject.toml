[project]
name = "bird-side-quests"
version = "0.1.0"
description = "Deep research over recent bird sightings: a lead fans out researchers to nearby birding spots, then a writer turns their findings into a cited outing plan for a beginner birdwatcher"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
